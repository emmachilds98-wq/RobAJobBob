<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="RobAJobBob — a sunrise over a road, with a flight path arcing over it">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF3E3"/>
      <stop offset="0.55" stop-color="#FBE3BE"/>
      <stop offset="1" stop-color="#FCD9A8"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#F7C558"/>
      <stop offset="0.5" stop-color="#F2A93B"/>
      <stop offset="1" stop-color="#EF5B3C"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E9179"/>
      <stop offset="1" stop-color="#0E5C50"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.44" r="0.55">
      <stop offset="0" stop-color="#EF5B3C" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#EF5B3C" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="disc"><circle cx="512" cy="512" r="336"/></clipPath>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <!-- full-bleed ground: safe for a maskable icon, all key art sits inside the centre 66% -->
  <rect width="1024" height="1024" fill="#111A2E"/>
  <circle cx="512" cy="492" r="470" fill="url(#glow)"/>

  <!-- sunburst spilling out beyond the porthole, so the mark isn't just a circle -->
  <path d="M493.4 144.5L530.6 144.5L518.5 60.0L505.5 60.0Z M637.3 166.8L659.1 175.8L670.8 126.4L663.9 123.5Z M750.2 235.4L776.6 261.8L827.7 193.5L818.5 184.3Z M836.2 352.9L845.2 374.7L888.5 348.1L885.6 341.2Z M867.5 481.4L867.5 518.6L952.0 506.5L952.0 493.5Z M845.2 625.3L836.2 647.1L885.6 658.8L888.5 651.9Z M776.6 738.2L750.2 764.6L818.5 815.7L827.7 806.5Z M659.1 824.2L637.3 833.2L663.9 876.5L670.8 873.6Z M530.6 855.5L493.4 855.5L505.5 940.0L518.5 940.0Z M386.7 833.2L364.9 824.2L353.2 873.6L360.1 876.5Z M273.8 764.6L247.4 738.2L196.3 806.5L205.5 815.7Z M187.8 647.1L178.8 625.3L135.5 651.9L138.4 658.8Z M156.5 518.6L156.5 481.4L72.0 493.5L72.0 506.5Z M178.8 374.7L187.8 352.9L138.4 341.2L135.5 348.1Z M247.4 261.8L273.8 235.4L205.5 184.3L196.3 193.5Z M364.9 175.8L386.7 166.8L360.1 123.5L353.2 126.4Z" fill="#E9B457" opacity="0.62"/>

  <!-- stamp ring -->
  <circle cx="512" cy="512" r="366" fill="none" stroke="#E9B457" stroke-width="7" stroke-dasharray="20 22" stroke-linecap="round" opacity="0.85"/>

  <!-- the scene -->
  <g clip-path="url(#disc)">
    <circle cx="512" cy="512" r="336" fill="url(#sky)"/>
    <path d="M672.1 454.5L669.7 467.3L792.1 487.7L793.3 481.4Z M648.9 516.6L645.2 522.2L721.3 570.3L723.0 567.9Z M607.9 560.6L597.1 567.8L669.3 668.9L674.6 665.3Z M547.6 588.0L541.0 589.4L560.8 677.2L563.7 676.6Z M487.5 590.1L474.7 587.7L454.3 710.1L460.6 711.3Z M425.4 566.9L419.8 563.2L371.7 639.3L374.1 641.0Z M381.4 525.9L374.2 515.1L273.1 587.3L276.7 592.6Z M354.0 465.6L352.6 459.0L264.8 478.8L265.4 481.7Z M351.9 405.5L354.3 392.7L231.9 372.3L230.7 378.6Z M375.1 343.4L378.8 337.8L302.7 289.7L301.0 292.1Z M416.1 299.4L426.9 292.2L354.7 191.1L349.4 194.7Z M476.4 272.0L483.0 270.6L463.2 182.8L460.3 183.4Z M536.5 269.9L549.3 272.3L569.7 149.9L563.4 148.7Z M598.6 293.1L604.2 296.8L652.3 220.7L649.9 219.0Z M642.6 334.1L649.8 344.9L750.9 272.7L747.3 267.4Z M670.0 394.4L671.4 401.0L759.2 381.2L758.6 378.3Z" fill="#F2A93B" opacity="0.22"/>
    <circle cx="512" cy="430" r="140" fill="url(#sun)"/>

    <!-- far ridge -->
    <path d="M150 690 L286 572 L360 638 L448 576 L536 660 L620 594 L716 682 L880 604 L880 900 L150 900 Z" fill="#41A992"/>
    <!-- near ridge -->
    <path d="M110 760 C 232 690, 320 754, 424 736 C 530 718, 600 780, 704 758 C 800 738, 858 770, 930 748 L930 900 L110 900 Z" fill="url(#ground)"/>
    <!-- the road, in perspective: it leaves the frame, which is rather the point -->
    <path d="M418 830 C 452 784, 470 754, 494 726 C 512 706, 532 696, 548 690 L580 690 C 560 714, 546 740, 540 772 C 532 800, 546 818, 566 834 C 540 842, 462 842, 418 830 Z" fill="#FDF3E3"/>
    <path d="M558 700 L540 744 M534 780 L536 818" fill="none" stroke="#0E5C50" stroke-width="9" stroke-linecap="round" opacity="0.4"/>

    <!-- flight path arcing over the sun -->
    <path d="M212 486 C 300 344, 448 300, 552 356 C 610 392, 640 386, 672 358" fill="none" stroke="#111A2E" stroke-width="11" stroke-linecap="round" stroke-dasharray="2 34" opacity="0.5"/>
    <!-- paper plane -->
    <g transform="translate(690 336) rotate(-44)">
      <path d="M-48 -32 L54 0 L-48 32 L-31 0 Z" fill="#111A2E"/>
      <path d="M-48 32 L-31 0 L18 13 Z" fill="#EF5B3C"/>
    </g>

    <path d="M298.0 268.0Q303.1 294.9 330.0 300.0Q303.1 305.1 298.0 332.0Q292.9 305.1 266.0 300.0Q292.9 294.9 298.0 268.0Z" fill="#EF5B3C" opacity="0.92"/>
    <path d="M388.0 208.0Q390.9 223.1 406.0 226.0Q390.9 228.9 388.0 244.0Q385.1 228.9 370.0 226.0Q385.1 223.1 388.0 208.0Z" fill="#177F6B" opacity="0.85"/>
    <path d="M612.0 191.0Q615.4 208.6 633.0 212.0Q615.4 215.4 612.0 233.0Q608.6 215.4 591.0 212.0Q608.6 208.6 612.0 191.0Z" fill="#E9B457" opacity="0.95"/>
  </g>

  <!-- porthole edge -->
  <circle cx="512" cy="512" r="336" fill="none" stroke="#0A1122" stroke-width="14"/>
  <circle cx="512" cy="512" r="324" fill="none" stroke="#FDF3E3" stroke-width="5" opacity="0.35"/>

  <!-- print grain -->
  <rect width="1024" height="1024" filter="url(#grain)" opacity="0.055" style="mix-blend-mode:overlay"/>
</svg>
